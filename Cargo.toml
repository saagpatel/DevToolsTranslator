[workspace]
resolver = "2"
members = [
  "crates/glassbox-contracts",
  "crates/glassbox-kernel",
  "crates/glassbox-import",
  "crates/glassbox-investigation",
  "crates/glassbox-browser-ipc",
  "apps/glassbox-browser-host",
  "crates/glassbox-live-source",
  "apps/glassbox-otlp-broker",
  "apps/glassbox-passive-context-broker",
  "apps/glassbox-process-context-broker",
  "apps/glassbox-native-bridge",
  "crates/glassbox-network-import",
  "crates/glassbox-har-import",
  "crates/glassbox-otlp-import",
  "crates/glassbox-evidence-bundle",
  "crates/glassbox-apple-log-import",
  "crates/glassbox-privacy",
  "apps/glassbox-import-worker",
  "crates/glassbox-fixtures",
  "scripts/glassbox/workflow-probe",
  "scripts/glassbox/parser-fuzz",
  "scripts/glassbox/instrumented-source-probe",
  "apps/desktop-tauri/src-tauri",
  "crates/dtt-core",
  "crates/dtt-storage",
  "crates/dtt-correlation",
  "crates/dtt-detectors",
  "crates/dtt-export",
  "crates/dtt-integrity"
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
hmac = "0.12"
hex = "0.4"
url = "2"
zeroize = "1"
time = { version = "0.3", features = ["parsing"] }
libc = "0.2"

[workspace.metadata.devtools-translator]
mode = "local_beta"
notes = "Implemented desktop app + MV3 extension with validated local launch and smoke path"
