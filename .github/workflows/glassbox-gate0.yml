name: Glassbox Gate 0

on:
  pull_request:
  push:
    branches:
      - "codex/glassbox-evidence-kernel"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Negative matcher self-test
        run: python3 scripts/glassbox/check_gate0.py --self-test
      - name: Candidate and notarization evidence self-tests
        run: |
          python3 scripts/glassbox/candidate_manifest.py --self-test
          python3 scripts/glassbox/notarization_batch.py --self-test
          python3 scripts/glassbox/fresh_vm_kit.py --self-test
          python3 scripts/glassbox/program_readiness.py --self-test
      - name: Validate Gate 0 contract and Glassbox source boundary
        run: python3 scripts/glassbox/check_gate0.py --receipt artifacts/gate0.json
      - name: Reject whitespace errors
        run: git diff --check origin/main...HEAD
      - name: Upload commit-bound Gate 0 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glassbox-gate0-receipt
          path: artifacts/gate0.json
